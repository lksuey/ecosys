# Verticais curadas — negócios de Teresina que rendem landing page de prospecção.
# Proposta inicial; ajuste à vontade (adicionar/remover verticais, refinar termos).
#
# Campos por item:
#   id            slug curto e estável (usado em logs, colunas, nomes de pasta)
#   rotulo        nome legível
#   termos_busca  1-3 frases que o Google Maps entende bem (o scanner roda uma busca
#                 por termo × local; mais termos = mais cobertura, mais tempo)
#   schema_type   @type schema.org que o gerador usa no JSON-LD (playbook §7)
#   prioridade    alta | media | baixa — ordem sugerida de varredura
#   cobertura     como fatiar geograficamente (o Maps trava ~40-60 resultados/busca):
#                   cidade  -> 1 busca do centro (nicho, < ~50 negócios na cidade)
#                   zonas   -> 1 busca por zona (~5: centro, norte, sul, sudeste, leste)
#                   bairros -> sweep dos bairros ativos (denso, centenas de negócios)
#                 zonas e bairros vêm de bairros.yaml.
#
# NÃO incluir alimentação aqui (ver exclusoes.yaml) — é regra do playbook §13.
# NÃO incluir venda de roupa infantil — depende de estoque/catálogo e checkout
# dentro do site (loja tipo e-commerce), não do modelo 1:1 que este ecossistema
# prospecta. Aluguel (ex.: fantasia infantil, roupa de festa infantil) continua
# permitido caso vire vertical própria — é um modelo 1:1, diferente de revenda.
# Reforço por categoria do Maps em exclusoes.yaml.

verticais:
  - id: moda-feminina
    rotulo: Moda feminina / boutique
    termos_busca: ["loja de roupas femininas", "boutique feminina"]
    schema_type: ClothingStore
    prioridade: alta
    cobertura: bairros

  - id: vestidos-festa
