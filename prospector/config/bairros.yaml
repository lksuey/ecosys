# Bairros de Teresina com comércio relevante — alvo da varredura categoria × bairro.
#
# lat/lng são APROXIMADOS (centro comercial do bairro) — servem só para centrar o
# mapa da busca; o nome do bairro no texto da query faz o trabalho pesado. Ajuste
# um ponto se a busca daquele bairro vier tumultuada de resultados de outro lugar.
#
# zoom: 15 cobre ~1 bairro. Baixe para 14 em bairros grandes (Dirceu, Centro).
#
# Campos: nome | lat | lng | zoom | ativo (false = pula na varredura)

cidade:
  nome: Teresina
  uf: PI
  centro: { lat: -5.0892, lng: -42.8016, zoom: 13 }   # cobertura "cidade": 1 busca daqui

# cobertura "zonas": 1 busca por zona (query sem nome de bairro). Os centros e o
# zoom são calibrados pra cada zona render ~40 resultados sem estourar o teto do Maps.
zonas:
  - { nome: "Zona Centro",   lat: -5.0890, lng: -42.8020, zoom: 14 }
  - { nome: "Zona Norte",    lat: -5.0430, lng: -42.8080, zoom: 13 }
  - { nome: "Zona Sul",      lat: -5.1360, lng: -42.7900, zoom: 13 }
  - { nome: "Zona Sudeste",  lat: -5.1230, lng: -42.7700, zoom: 13 }
  - { nome: "Zona Leste",    lat: -5.0650, lng: -42.7800, zoom: 13 }

